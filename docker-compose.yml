services:
  lead-gen-pipeline:
    build: .
    container_name: lead-gen-pipeline
    restart: "no"

    environment:
      - DATABASE__DATABASE_URL=sqlite+aiosqlite:////app/data/leads.db
      - LOGGING__LOG_LEVEL=INFO
      - CRAWLER__RESPECT_ROBOTS_TXT=true
      - CRAWLER__USE_PLAYWRIGHT_BY_DEFAULT=true
      - CRAWLER__DEFAULT_TIMEOUT_SECONDS=30
      - MAX_PIPELINE_CONCURRENCY=3
      - LLM__MODEL_PATH=/app/models/qwen2-7b-instruct-q4_k_m.gguf

    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models:/app/models

    # The local LLM needs ~8 GB RAM with the 4 GB model loaded.
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G

    networks:
      - lead-gen-network

    # Chamber-directory processing (requires the model in ./models). Swap for the
    # single-site path with: ["lead-gen", "run", "--input", "/app/data/urls_seed.csv"]
    command: ["lead-gen", "chambers", "--input", "/app/data/chamber_urls.csv"]

networks:
  lead-gen-network:
    driver: bridge
